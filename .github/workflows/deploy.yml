name: Deploy to Cloudflare Pages

on:
  push:
    branches: [main, staging]
  workflow_dispatch:

concurrency:
  group: pages-deploy-${{ github.ref_name }}
  cancel-in-progress: true

jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npm run build
      # main -> production (hillcrest-website.pages.dev)
      # staging -> preview alias (staging.hillcrest-website.pages.dev)
      - name: Deploy
        uses: cloudflare/wrangler-action@v3
        with:
          apiToken: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          accountId: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          command: pages deploy dist --project-name hillcrest-website --branch ${{ github.ref_name }}
